name: xstackapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.0.17
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  hooks_riverpod: ^3.4.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  talker_dio_logger: ^5.1.20
  talker_flutter: ^5.1.20
  talker_riverpod_logger: ^5.1.20
  signalr_netcore: ^1.4.4
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
